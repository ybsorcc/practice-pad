<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Pad</title>
<meta name="description" content="Sort the day's 16 words into four groups before you play.">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181e" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Practice Pad">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="frame" id="frame">
  <main class="app" id="app"></main>
</div>
<input type="file" id="fileIn" accept="image/*" class="sr" aria-label="Choose screenshot" tabindex="-1">
<div class="toast" id="toast" role="status"></div>
<script src="version.js"></script>
<script src="ocr.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
